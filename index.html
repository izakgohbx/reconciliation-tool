<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Billing Reconciliation Tool</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>* { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: 'Inter', system-ui, sans-serif; background: #f9fafb; }</style>
</head>
<body>
<div id="root"></div>

<!-- Worker script inlined as a blob -->
<script id="worker-src" type="text/plain">
importScripts('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');

const EXCLUDE_KEYWORDS = ["id","type","date","time","group","rate","rule","vehicle","agency","days","name","status","period","start","end","update","driver","ops","billing","rest day","data source","restday","datasource","payment"];
function isCostCol(col){ const l=col.toLowerCase().trim(); return !EXCLUDE_KEYWORDS.some(kw=>l.includes(kw)); }
function isTotalCol(col){ return col.toLowerCase().includes("total"); }
function parseVal(v){
  if(v===""||v===null||v===undefined) return null;
  const cleaned=String(v).replace(/[^0-9.\-]/g,"");
  if(cleaned===""||cleaned==="-") return null;
  const x=parseFloat(cleaned); return isNaN(x)?null:x;
}
function orZero(v){return v===null?0:v;}
function f2(v){return Math.round(v*100)/100;}
function pct(a,b){return b!==0?`${((a/b)*100).toFixed(1)}%`:"N/A";}
function countDuplicates(rows,matchKey){
  const counts={};
  for(const r of rows){const k=String(r[matchKey]??"").trim();if(k)counts[k]=(counts[k]||0)+1;}
  let unique=0,duped=0;
  for(const cnt of Object.values(counts)){if(cnt===1)unique+=1;else duped+=cnt;}
  return{unique,duped,total:rows.length};
}
function getPaymentType(row){
  const pt=String(row["Payment Type"]??"").trim().toLowerCase();
  if(pt==="salary") return "Salary";
  if(pt==="incentive") return "Incentive";
  if(pt==="salary and incentive"||pt==="salary & incentive") return "SalaryAndIncentive";
  return "Salary";
}

function readArrayBuffer(ab){
  const wb=XLSX.read(ab,{type:"array"});
  const all=[];
  for(const sn of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:""});
    all.push(...rows);
  }
  return all;
}

// ── Palette ──────────────────────────────────────────────────────────────────
const P={
  navy:"1E3A5F",blue:"2563EB",teal:"0D9488",green:"16A34A",red:"DC2626",amber:"D97706",purple:"7C3AED",
  lgrey:"F3F4F6",lred:"FEE2E2",lgreen:"DCFCE7",lyellow:"FEF9C3",lblue:"DBEAFE",lteal:"CCFBF1",lpurple:"EDE9FE",
  white:"FFFFFF",text:"111827",muted:"6B7280",
};
const fillS=hex=>({patternType:"solid",fgColor:{rgb:hex}});
const noFill=()=>({patternType:"none"});
function cell(v,opts={}){
  const{bold=false,italic=false,sz=9,fc=P.text,bg=null,align="left",fmt=null,border=true}=opts;
  const brd=border?{top:{style:"thin",color:{rgb:"E5E7EB"}},bottom:{style:"thin",color:{rgb:"E5E7EB"}},left:{style:"thin",color:{rgb:"E5E7EB"}},right:{style:"thin",color:{rgb:"E5E7EB"}}}:{};
  return{v,t:typeof v==="number"?"n":"s",s:{font:{bold,italic,sz,color:{rgb:fc}},alignment:{horizontal:align,vertical:"center"},fill:bg?fillS(bg):noFill(),border:brd},...(fmt?{z:fmt}:{})};
}
function hdr(v,bg=P.navy,align="center",sz=9){return cell(v,{bold:true,fc:P.white,bg,align,sz});}
function numCell(v,bg=null,fc=P.text){
  if(v===null)return cell("",{bg,fc,align:"right"});
  return cell(v,{bg,fc,align:"right",fmt:"#,##0.00"});
}
function enc(r,c){return XLSX.utils.encode_cell({r,c});}
function setRef(ws,maxR,maxC){ws["!ref"]=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:maxR,c:maxC}});}
function colW(arr){return arr.map(w=>({wch:w}));}
function mrg(s,e){return{s,e};}

function buildWorkbook(domain,matchKey,splitPaymentType,offRaw,sysRaw,post){
  if(!splitPaymentType) return buildSinglePass(domain,matchKey,offRaw,sysRaw,post);
  return buildSplitPass(domain,matchKey,offRaw,sysRaw,post);
}

function today(){
  const d=new Date();
  const dt=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  const tm=`${String(d.getHours()).padStart(2,"0")}${String(d.getMinutes()).padStart(2,"0")}${String(d.getSeconds()).padStart(2,"0")}`;
  return `${dt}_${tm}`;
}

// ── Raw sheet: no styling for performance ────────────────────────────────────
function buildRaw(rows){return XLSX.utils.json_to_sheet(rows,{defval:""});}

// ── Single-pass (Truck Rental Cost) ──────────────────────────────────────────
function buildSinglePass(domain,matchKey,offRaw,sysRaw,post){
  post("Building index...");
  const getCostCols=rows=>!rows.length?[]:Object.keys(rows[0]).filter(c=>c!==matchKey&&c!=="Billing ID"&&isCostCol(c));
  const costColsAll=getCostCols(offRaw);
  const totalCols=costColsAll.filter(isTotalCol);
  const compCols=costColsAll.filter(c=>!isTotalCol(c));
  const infoCols=Object.keys(offRaw[0]||{}).filter(c=>c!==matchKey&&!costColsAll.includes(c));

  function buildIdx(rows){
    const idx={},rawMap={};
    for(const row of rows){const k=String(row[matchKey]??"").trim();if(!k)continue;
      if(!idx[k]){idx[k]={};rawMap[k]={...row};for(const c of costColsAll)idx[k][c]=parseVal(row[c]);}
      else{for(const c of costColsAll){const ex=idx[k][c],nv=parseVal(row[c]);if(nv!==null)idx[k][c]=f2((ex??0)+nv);}}}
    return{idx,rawMap};
  }
  const{idx:offIdx,rawMap:offRawMap}=buildIdx(offRaw);
  const{idx:sysIdx,rawMap:sysRawMap}=buildIdx(sysRaw);
  const offKeys=Object.keys(offIdx),sysKeys=Object.keys(sysIdx);
  const matchedKeys=offKeys.filter(k=>sysIdx[k]);
  const offOnlyKeys=offKeys.filter(k=>!sysIdx[k]);
  const sysOnlyKeys=sysKeys.filter(k=>!offIdx[k]);
  const sysSuccessRows=sysRaw.filter(r=>r["Billing Status"]==="Success");
  const sysFailRows=sysRaw.filter(r=>r["Billing Status"]==="Fail");
  const sysDup=countDuplicates(sysRaw,matchKey),offDup=countDuplicates(offRaw,matchKey);

  function cmp(k){const res={};for(const c of costColsAll){const ov=offIdx[k]?.[c]??null,sv=sysIdx[k]?.[c]??null;res[c]={ov,sv,diff:f2(orZero(sv)-orZero(ov)),match:orZero(ov)===orZero(sv)};}return res;}
  const fullMatchKeys=matchedKeys.filter(k=>costColsAll.every(c=>cmp(k)[c].match));
  const mismatchKeys=matchedKeys.filter(k=>!costColsAll.every(c=>cmp(k)[c].match));

  function calcAcc(){
    let num=0,den=0;
    const cols=compCols.length?compCols:costColsAll;
    for(const k of offKeys) den+=cols.reduce((s,c)=>s+orZero(offIdx[k]?.[c]),0);
    for(const k of matchedKeys){const comparison=cmp(k);for(const c of cols){if(comparison[c].match)num+=orZero(offIdx[k]?.[c]);}}
    return den>0?`${((num/den)*100).toFixed(1)}%`:"N/A";
  }
  function compStat(c){
    const offTotal=offKeys.reduce((s,k)=>s+orZero(offIdx[k]?.[c]),0);
    const sysTotal=matchedKeys.reduce((s,k)=>s+orZero(sysIdx[k]?.[c]),0);
    const variance=f2(sysTotal-offTotal);
    const varPct=offTotal!==0?`${((variance/Math.abs(offTotal))*100).toFixed(1)}%`:"N/A";
    return{offTotal:f2(offTotal),sysTotal:f2(sysTotal),variance,varPct};
  }

  post("Building summary sheet...");
  function buildSummary(){
    const ws={},mrgs=[];let r=0;const W=5;
    const st=(t,bg)=>{ws[enc(r,0)]=cell(t,{bold:true,sz:9,fc:P.white,bg});mrgs.push(mrg({r,c:0},{r,c:W}));r++;};
    const r2=(l,v,bg,sub="",vb=true)=>{ws[enc(r,0)]=cell(l,{bg,sz:9});mrgs.push(mrg({r,c:0},{r,c:3}));ws[enc(r,4)]=cell(typeof v==="number"?v:String(v),{bg,sz:9,align:"right",bold:vb});ws[enc(r,5)]=cell(sub,{bg,fc:P.muted,sz:8,align:"center"});r++;};
    const th=(labels,bg=P.lblue)=>{labels.forEach((h,i)=>{ws[enc(r,i)]=cell(h,{bold:true,sz:8,fc:P.navy,bg,align:i===0?"left":"center"});});r++;};
    ws[enc(r,0)]=cell(`${domain} Reconciliation Report`,{bold:true,sz:14,fc:P.navy,align:"center",border:false});mrgs.push(mrg({r,c:0},{r,c:W}));r++;
    ws[enc(r,0)]=cell(`Generated: ${new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})} ${new Date().toLocaleTimeString()}`,{italic:true,sz:8,fc:P.muted,align:"center",border:false});mrgs.push(mrg({r,c:0},{r,c:W}));r+=2;
    st("SYSTEM FILE",P.navy);
    r2("Total rows in System File",sysRaw.length,P.lgrey);
    r2("  ↳  Unique IDs",sysDup.unique,P.lgrey,"(IDs appearing exactly once)");
    r2("  ↳  Duplicated IDs",sysDup.duped,P.lgrey,"(total rows of IDs appearing >1 time)",false);
    r2("  ↳  Billing Status: Success",sysSuccessRows.length,P.lgreen,"(all rows incl. duplicates)");
    r2("  ↳  Billing Status: Fail",sysFailRows.length,P.lred,"(all rows incl. duplicates)");
    r2("Overall Accuracy %",calcAcc(),P.lteal);r++;
    st("RECONCILIATION SUMMARY",P.teal);
    r2("Offline File — Total rows",offRaw.length,P.lgrey);r2("Offline File — Unique IDs",offDup.unique,P.lgrey,"(IDs appearing exactly once)");r2("Offline File — Duplicated IDs",offDup.duped,P.lgrey,"(total rows appearing >1 time)",false);
    r2("System File — Total rows",sysRaw.length,P.lgrey);r2("System File — Unique IDs",sysDup.unique,P.lgrey,"(IDs appearing exactly once)");r2("System File — Duplicated IDs",sysDup.duped,P.lgrey,"(total rows appearing >1 time)",false);r++;
    r2("IDs in both Offline & System",matchedKeys.length,P.lblue,pct(matchedKeys.length,offKeys.length)+" of offline");
    r2("IDs in Offline only",offOnlyKeys.length,P.lred,pct(offOnlyKeys.length,offKeys.length)+" of offline");
    r2("IDs in System only",sysOnlyKeys.length,P.lyellow,pct(sysOnlyKeys.length,sysKeys.length)+" of system");
    r2("Full Match IDs",fullMatchKeys.length,P.lgreen,pct(fullMatchKeys.length,offKeys.length)+" of offline");
    r2("Overall Accuracy %",calcAcc(),P.lteal);r++;
    st("COST COMPONENTS BREAKDOWN",P.teal);
    th(["Cost Component","Offline Total","System Total","Variance ($)","Variance %"]);
    for(const c of [...compCols,...totalCols]){const isTot=isTotalCol(c);const cs=compStat(c);const bad=cs.variance!==0,bg=bad?P.lred:P.lgreen,fc=bad?P.red:P.green;
      ws[enc(r,0)]=cell(c,{sz:9,bg,bold:isTot});ws[enc(r,1)]=numCell(cs.offTotal,bg);ws[enc(r,2)]=numCell(cs.sysTotal,bg);ws[enc(r,3)]=numCell(cs.variance,bg,cs.variance<0?P.red:cs.variance>0?P.green:P.text);ws[enc(r,4)]=cell(cs.varPct,{sz:9,bg,fc,align:"center",bold:isTot});r++;}
    ws["!merges"]=mrgs;setRef(ws,r,W);ws["!cols"]=colW([34,16,16,16,12]);ws["!rows"]=Array(r+1).fill({hpt:18});return ws;
  }

  function buildDetail(keys,titleText,titleBg,diffAlwaysZero=false){
    const ws={},mrgs=[];let r=0;const fixedH=[matchKey,...infoCols];const totalC=fixedH.length+costColsAll.length*3-1;
    ws[enc(r,0)]=cell(`${titleText} — ${keys.length} records`,{bold:true,sz:10,fc:P.white,bg:titleBg,align:"center"});mrgs.push(mrg({r,c:0},{r,c:totalC}));r++;
    fixedH.forEach((h,i)=>{ws[enc(r,i)]=hdr(h,P.navy,i===0?"left":"center");});let c=fixedH.length;
    for(const comp of costColsAll){ws[enc(r,c)]=hdr(comp,P.blue);mrgs.push(mrg({r,c},{r,c:c+2}));c+=3;}r++;
    fixedH.forEach((_,i)=>{ws[enc(r,i)]=hdr("",P.navy);});c=fixedH.length;
    for(const _ of costColsAll){["Offline","System","Diff"].forEach((s,i)=>{ws[enc(r,c+i)]=hdr(s,P.blue);});c+=3;}r++;
    for(const k of keys){
      const rawRow=offRawMap[k]||sysRawMap[k]||{};const comparison=(offIdx[k]&&sysIdx[k])?cmp(k):null;let col=0;
      ws[enc(r,col++)]=cell(k,{sz:9});
      for(const inf of infoCols)ws[enc(r,col++)]=cell(String(rawRow[inf]??""),{sz:9});
      for(const comp of costColsAll){
        const ov=comparison?comparison[comp].ov:(offIdx[k]?.[comp]??null);
        const sv=comparison?comparison[comp].sv:null;
        const diff=comparison?comparison[comp].diff:null;
        const match=comparison?comparison[comp].match:true;
        ws[enc(r,col++)]=numCell(ov);ws[enc(r,col++)]=numCell(sv);
        ws[enc(r,col++)]=cell(diffAlwaysZero?0:(diff??0),{bg:match?P.lgreen:P.lred,fc:match?P.green:P.red,bold:!match,align:"right",fmt:"#,##0.00"});
      }r++;
    }
    ws["!merges"]=mrgs;setRef(ws,r,totalC);ws["!cols"]=colW([16,...infoCols.map(()=>14),...costColsAll.flatMap(()=>[13,13,11])]);return ws;
  }

  function buildOfflineOnly(){
    const ws={},mrgs=[];let r=0;const hdrs=[matchKey,...infoCols,...costColsAll];const totalC=hdrs.length-1;
    ws[enc(r,0)]=cell(`Offline Only — ${offOnlyKeys.length} records`,{bold:true,sz:10,fc:P.white,bg:P.red,align:"center"});mrgs.push(mrg({r,c:0},{r,c:totalC}));r++;
    hdrs.forEach((h,i)=>{ws[enc(r,i)]=hdr(h,P.navy,i===0?"left":"center");});r++;
    for(const k of offOnlyKeys){const row=offRawMap[k]||{};let col=0;ws[enc(r,col++)]=cell(k,{sz:9});for(const inf of infoCols)ws[enc(r,col++)]=cell(String(row[inf]??""),{sz:9});for(const comp of costColsAll)ws[enc(r,col++)]=numCell(offIdx[k]?.[comp]??null);r++;}
    ws["!merges"]=mrgs;setRef(ws,r,totalC);ws["!cols"]=colW([16,...infoCols.map(()=>14),...costColsAll.map(()=>14)]);return ws;
  }

  function buildFailed(){
    const failedRows=sysRaw.filter(r=>r["Billing Status"]==="Fail");
    const ws={},mrgs=[];let r=0;const hdrs=failedRows.length?Object.keys(failedRows[0]):[matchKey];const totalC=Math.max(hdrs.length-1,0);
    ws[enc(r,0)]=cell(`Failed Billing Orders — ${failedRows.length} records`,{bold:true,sz:10,fc:P.white,bg:P.amber,align:"center"});mrgs.push(mrg({r,c:0},{r,c:totalC}));r++;
    hdrs.forEach((h,i)=>{ws[enc(r,i)]=hdr(h,P.navy,i===0?"left":"center");});r++;
    for(const row of failedRows){hdrs.forEach((h,i)=>{const v=row[h]??"";ws[enc(r,i)]=typeof v==="number"?numCell(v,P.lyellow):cell(String(v),{sz:9,bg:P.lyellow});});r++;}
    ws["!merges"]=mrgs;setRef(ws,r,totalC);ws["!cols"]=hdrs.map(()=>({wch:16}));return ws;
  }

  const wb=XLSX.utils.book_new();
  post("Writing sheets...");
  XLSX.utils.book_append_sheet(wb,buildSummary(),"Summary");
  post("Writing Matched Records...");
  XLSX.utils.book_append_sheet(wb,buildDetail(fullMatchKeys,"Matched Records",P.green,true),"Matched Records");
  post("Writing Mismatch Records...");
  XLSX.utils.book_append_sheet(wb,buildDetail(mismatchKeys,"Mismatch Records",P.red,false),"Mismatch Records");
  post("Writing Offline Only...");
  XLSX.utils.book_append_sheet(wb,buildOfflineOnly(),"Offline Only");
  XLSX.utils.book_append_sheet(wb,buildFailed(),"Failed Billing Orders");
  post("Writing raw sheets...");
  XLSX.utils.book_append_sheet(wb,buildRaw(sysRaw),"Raw System File");
  XLSX.utils.book_append_sheet(wb,buildRaw(offRaw),"Raw Offline File");
  return wb;
}

// ── Split-pass (Driver Cost / Labor Payroll) ─────────────────────────────────
function buildSplitPass(domain,matchKey,offRaw,sysRaw,post){
  const PASSES=[
    {key:"Salary",label:"Salary",filter:r=>getPaymentType(r)==="Salary",bg:P.teal,hdrBg:P.teal},
    {key:"Incentive",label:"Incentive",filter:r=>getPaymentType(r)==="Incentive",bg:P.purple,hdrBg:P.purple},
    {key:"SalaryAndIncentive",label:"Salary and Incentive",filter:r=>getPaymentType(r)==="SalaryAndIncentive",bg:"B45309",hdrBg:"B45309"},
  ];

  post("Splitting by Payment Type...");
  const passes=PASSES.map(p=>{
    const offRows=offRaw.filter(p.filter),sysRows=sysRaw.filter(p.filter);
    const costColsAll=!offRows.length?[]:Object.keys(offRows[0]).filter(c=>c!==matchKey&&c!=="Billing ID"&&isCostCol(c));
    const totalCols=costColsAll.filter(isTotalCol),compCols=costColsAll.filter(c=>!isTotalCol(c));
    const infoCols=Object.keys(offRows[0]||offRaw[0]||{}).filter(c=>c!==matchKey&&!costColsAll.includes(c));
    function buildIdx(rows){const idx={},rawMap={};for(const row of rows){const k=String(row[matchKey]??"").trim();if(!k)continue;if(!idx[k]){idx[k]={};rawMap[k]={...row};for(const c of costColsAll)idx[k][c]=parseVal(row[c]);}else{for(const c of costColsAll){const ex=idx[k][c],nv=parseVal(row[c]);if(nv!==null)idx[k][c]=f2((ex??0)+nv);}}}return{idx,rawMap};}
    const{idx:offIdx,rawMap:offRawMap}=buildIdx(offRows);const{idx:sysIdx,rawMap:sysRawMap}=buildIdx(sysRows);
    const offKeys=Object.keys(offIdx),sysKeys=Object.keys(sysIdx);
    const matchedKeys=offKeys.filter(k=>sysIdx[k]),offOnlyKeys=offKeys.filter(k=>!sysIdx[k]),sysOnlyKeys=sysKeys.filter(k=>!offIdx[k]);
    const dup={off:countDuplicates(offRows,matchKey),sys:countDuplicates(sysRows,matchKey)};
    function cmp(k){const res={};for(const c of costColsAll){const ov=offIdx[k]?.[c]??null,sv=sysIdx[k]?.[c]??null;res[c]={ov,sv,diff:f2(orZero(sv)-orZero(ov)),match:orZero(ov)===orZero(sv)};}return res;}
    const fullMatchKeys=matchedKeys.filter(k=>costColsAll.every(c=>cmp(k)[c].match));
    const mismatchKeys=matchedKeys.filter(k=>!costColsAll.every(c=>cmp(k)[c].match));
    function calcAcc(){
      let num=0,den=0;
      const cols=compCols.length?compCols:costColsAll;
      for(const k of offKeys) den+=cols.reduce((s,c)=>s+orZero(offIdx[k]?.[c]),0);
      for(const k of matchedKeys){const comparison=cmp(k);for(const c of cols){if(comparison[c].match)num+=orZero(offIdx[k]?.[c]);}}
      return den>0?`${((num/den)*100).toFixed(1)}%`:"N/A";
    }
    function compStat(c){const offTotal=offKeys.reduce((s,k)=>s+orZero(offIdx[k]?.[c]),0);const sysTotal=matchedKeys.reduce((s,k)=>s+orZero(sysIdx[k]?.[c]),0);const variance=f2(sysTotal-offTotal);const varPct=offTotal!==0?`${((variance/Math.abs(offTotal))*100).toFixed(1)}%`:"N/A";return{offTotal:f2(offTotal),sysTotal:f2(sysTotal),variance,varPct};}
    return{...p,offRows,sysRows,costColsAll,totalCols,compCols,infoCols,offIdx,sysIdx,offRawMap,sysRawMap,offKeys,sysKeys,matchedKeys,offOnlyKeys,sysOnlyKeys,dup,cmp,fullMatchKeys,mismatchKeys,calcAcc,compStat};
  });

  const sysSuccessRows=sysRaw.filter(r=>r["Billing Status"]==="Success");
  const sysFailRows=sysRaw.filter(r=>r["Billing Status"]==="Fail");
  const sysDupAll=countDuplicates(sysRaw,matchKey);
  const uniqueSysIDs=new Set(sysRaw.map(r=>String(r[matchKey]??"").trim()).filter(Boolean)).size;

  function calcOverallAcc(){
    let num=0,den=0;
    for(const p of passes){
      const cols=p.compCols.length?p.compCols:p.costColsAll;
      for(const k of p.offKeys) den+=cols.reduce((s,c)=>s+orZero(p.offIdx[k]?.[c]),0);
      for(const k of p.matchedKeys){const comparison=p.cmp(k);for(const c of cols){if(comparison[c].match)num+=orZero(p.offIdx[k]?.[c]);}}
    }
    return den>0?`${((num/den)*100).toFixed(1)}%`:"N/A";
  }

  post("Building summary sheet...");
  function buildSummary(){
    const ws={},mrgs=[];let r=0;const W=5;
    const st=(t,bg)=>{ws[enc(r,0)]=cell(t,{bold:true,sz:9,fc:P.white,bg});mrgs.push(mrg({r,c:0},{r,c:W}));r++;};
    const r2=(l,v,bg,sub="",vb=true)=>{ws[enc(r,0)]=cell(l,{bg,sz:9});mrgs.push(mrg({r,c:0},{r,c:3}));ws[enc(r,4)]=cell(typeof v==="number"?v:String(v),{bg,sz:9,align:"right",bold:vb});ws[enc(r,5)]=cell(sub,{bg,fc:P.muted,sz:8,align:"center"});r++;};
    const th=(labels,bg=P.lblue)=>{labels.forEach((h,i)=>{ws[enc(r,i)]=cell(h,{bold:true,sz:8,fc:P.navy,bg,align:i===0?"left":"center"});});r++;};
    ws[enc(r,0)]=cell(`${domain} Reconciliation Report`,{bold:true,sz:14,fc:P.navy,align:"center",border:false});mrgs.push(mrg({r,c:0},{r,c:W}));r++;
    ws[enc(r,0)]=cell(`Generated: ${new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})} ${new Date().toLocaleTimeString()}`,{italic:true,sz:8,fc:P.muted,align:"center",border:false});mrgs.push(mrg({r,c:0},{r,c:W}));r+=2;
    st("SYSTEM FILE",P.navy);
    r2("Total rows in System File",sysRaw.length,P.lgrey);
    r2("Total Unique Driver IDs",uniqueSysIDs,P.lgrey,"(COUNTA of unique Driver IDs)");
    r2("  ↳  Unique IDs (appearing exactly once)",sysDupAll.unique,P.lgrey);
    r2("  ↳  Duplicated IDs (total rows of IDs appearing >1 time)",sysDupAll.duped,P.lgrey,"",false);
    r2("  ↳  Billing Status: Success",sysSuccessRows.length,P.lgreen,"(all rows incl. duplicates)");
    r2("  ↳  Billing Status: Fail",sysFailRows.length,P.lred,"(all rows incl. duplicates)");
    r2("Overall Accuracy %",calcOverallAcc(),P.lteal);r++;
    for(const p of passes){
      if(!p.offRows.length&&!p.sysRows.length) continue;
      const lpBg=p.bg===P.teal?P.lblue:p.bg===P.purple?P.lpurple:"FEF3C7";
      st(`${p.label.toUpperCase()} COMPONENTS BREAKDOWN`,p.bg);
      th(["Cost Component","Offline Total","System Total","Variance ($)","Variance %"],lpBg);
      for(const c of [...p.compCols,...p.totalCols]){const isTot=isTotalCol(c);const cs=p.compStat(c);const bad=cs.variance!==0,bg=bad?P.lred:P.lgreen,fc=bad?P.red:P.green;
        ws[enc(r,0)]=cell(c,{sz:9,bg,bold:isTot});ws[enc(r,1)]=numCell(cs.offTotal,bg);ws[enc(r,2)]=numCell(cs.sysTotal,bg);ws[enc(r,3)]=numCell(cs.variance,bg,cs.variance<0?P.red:cs.variance>0?P.green:P.text);ws[enc(r,4)]=cell(cs.varPct,{sz:9,bg,fc,align:"center",bold:isTot});r++;}
      ws[enc(r,0)]=cell(`${p.label} Accuracy %`,{sz:9,bg:P.lteal,bold:true});
      mrgs.push(mrg({r,c:0},{r,c:3}));
      ws[enc(r,4)]=cell(p.calcAcc(),{sz:9,bg:P.lteal,fc:P.teal,bold:true,align:"center"});
      r++;r++;
    }
    ws["!merges"]=mrgs;setRef(ws,r,W);ws["!cols"]=colW([34,16,16,16,12]);ws["!rows"]=Array(r+1).fill({hpt:18});return ws;
  }

  function buildDetailSheet(getKeys,titleText,titleBg,diffAlwaysZero=false){
    const ws={},mrgs=[];let r=0;
    const maxCols=Math.max(...passes.map(p=>p.costColsAll.length),1);
    const baseInfoCols=passes[0]?.infoCols||[];
    const totalC=1+baseInfoCols.length+maxCols*3;
    ws[enc(r,0)]=cell(titleText,{bold:true,sz:10,fc:P.white,bg:titleBg,align:"center"});mrgs.push(mrg({r,c:0},{r,c:totalC}));r++;
    for(const p of passes){
      const keys=getKeys(p);if(!keys.length&&p.offRows.length===0&&p.sysRows.length===0)continue;
      const fixedH=[matchKey,...p.infoCols];const pTotalC=fixedH.length+p.costColsAll.length*3-1;
      ws[enc(r,0)]=cell(`${p.label} (Payment Type: ${p.label}) — ${keys.length} records`,{bold:true,sz:9,fc:P.white,bg:p.bg});mrgs.push(mrg({r,c:0},{r,c:pTotalC}));r++;
      fixedH.forEach((h,i)=>{ws[enc(r,i)]=hdr(h,P.navy,i===0?"left":"center");});let c=fixedH.length;
      for(const comp of p.costColsAll){ws[enc(r,c)]=hdr(comp,P.blue);mrgs.push(mrg({r,c},{r,c:c+2}));c+=3;}r++;
      fixedH.forEach((_,i)=>{ws[enc(r,i)]=hdr("",P.navy);});c=fixedH.length;
      for(const _ of p.costColsAll){["Offline","System","Diff"].forEach((s,i)=>{ws[enc(r,c+i)]=hdr(s,P.blue);});c+=3;}r++;
      for(const k of keys){
        const rawRow=p.offRawMap[k]||p.sysRawMap[k]||{};const comparison=(p.offIdx[k]&&p.sysIdx[k])?p.cmp(k):null;let col=0;
        ws[enc(r,col++)]=cell(k,{sz:9});
        for(const inf of p.infoCols)ws[enc(r,col++)]=cell(String(rawRow[inf]??""),{sz:9});
        for(const comp of p.costColsAll){
          const ov=comparison?comparison[comp].ov:(p.offIdx[k]?.[comp]??null);
          const sv=comparison?comparison[comp].sv:null;
          const diff=comparison?comparison[comp].diff:null;
          const match=comparison?comparison[comp].match:true;
          ws[enc(r,col++)]=numCell(ov);ws[enc(r,col++)]=numCell(sv);
          ws[enc(r,col++)]=cell(diffAlwaysZero?0:(diff??0),{bg:match?P.lgreen:P.lred,fc:match?P.green:P.red,bold:!match,align:"right",fmt:"#,##0.00"});
        }r++;
      }
      r++;
    }
    ws["!merges"]=mrgs;setRef(ws,r,totalC);ws["!cols"]=colW([16,...baseInfoCols.map(()=>14),...Array(maxCols*3).fill(13)]);return ws;
  }

  function buildOfflineOnly(){
    const ws={},mrgs=[];let r=0;
    const maxCols=Math.max(...passes.map(p=>p.costColsAll.length),1);
    const totalC=1+(passes[0]?.infoCols?.length||0)+maxCols;
    ws[enc(r,0)]=cell("OFFLINE ONLY RECORDS",{bold:true,sz:10,fc:P.white,bg:P.red,align:"center"});mrgs.push(mrg({r,c:0},{r,c:totalC}));r++;
    for(const p of passes){if(!p.offOnlyKeys.length)continue;const hdrs=[matchKey,...p.infoCols,...p.costColsAll];const tC=hdrs.length-1;
      ws[enc(r,0)]=cell(`${p.label} — ${p.offOnlyKeys.length} records not found in System File`,{bold:true,sz:9,fc:P.white,bg:p.bg});mrgs.push(mrg({r,c:0},{r,c:tC}));r++;
      hdrs.forEach((h,i)=>{ws[enc(r,i)]=hdr(h,P.navy,i===0?"left":"center");});r++;
      for(const k of p.offOnlyKeys){const row=p.offRawMap[k]||{};let col=0;ws[enc(r,col++)]=cell(k,{sz:9});for(const inf of p.infoCols)ws[enc(r,col++)]=cell(String(row[inf]??""),{sz:9});for(const comp of p.costColsAll)ws[enc(r,col++)]=numCell(p.offIdx[k]?.[comp]??null);r++;}
      r++;}
    ws["!merges"]=mrgs;setRef(ws,r,totalC);ws["!cols"]=colW([16,...(passes[0]?.infoCols||[]).map(()=>14),...Array(maxCols).fill(14)]);return ws;
  }

  function buildFailed(){
    const failedRows=sysRaw.filter(r=>r["Billing Status"]==="Fail");
    const ws={},mrgs=[];let r=0;const hdrs=failedRows.length?Object.keys(failedRows[0]):[matchKey];const totalC=Math.max(hdrs.length-1,0);
    ws[enc(r,0)]=cell(`Failed Billing Orders — ${failedRows.length} records`,{bold:true,sz:10,fc:P.white,bg:P.amber,align:"center"});mrgs.push(mrg({r,c:0},{r,c:totalC}));r++;
    hdrs.forEach((h,i)=>{ws[enc(r,i)]=hdr(h,P.navy,i===0?"left":"center");});r++;
    for(const row of failedRows){hdrs.forEach((h,i)=>{const v=row[h]??"";ws[enc(r,i)]=typeof v==="number"?numCell(v,P.lyellow):cell(String(v),{sz:9,bg:P.lyellow});});r++;}
    ws["!merges"]=mrgs;setRef(ws,r,totalC);ws["!cols"]=hdrs.map(()=>({wch:16}));return ws;
  }

  const wb=XLSX.utils.book_new();
  post("Writing Summary...");
  XLSX.utils.book_append_sheet(wb,buildSummary(),"Summary");
  post("Writing Matched Records...");
  XLSX.utils.book_append_sheet(wb,buildDetailSheet(p=>p.fullMatchKeys,"Matched Records — All components match",P.green,true),"Matched Records");
  post("Writing Mismatch Records...");
  XLSX.utils.book_append_sheet(wb,buildDetailSheet(p=>p.mismatchKeys,"Mismatch Records — Requires review",P.red,false),"Mismatch Records");
  post("Writing Offline Only...");
  XLSX.utils.book_append_sheet(wb,buildOfflineOnly(),"Offline Only");
  XLSX.utils.book_append_sheet(wb,buildFailed(),"Failed Billing Orders");
  post("Writing raw sheets...");
  XLSX.utils.book_append_sheet(wb,buildRaw(sysRaw),"Raw System File");
  XLSX.utils.book_append_sheet(wb,buildRaw(offRaw),"Raw Offline File");
  return wb;
}

self.onmessage=function(e){
  const{type,payload}=e.data;
  if(type==="process"){
    try{
      const{domain,matchKey,splitPaymentType,market,billingType,offAB,sysAB}=payload;
      self.postMessage({type:"progress",msg:"Parsing files..."});
      const offRaw=readArrayBuffer(offAB);
      const sysRaw=readArrayBuffer(sysAB);
      self.postMessage({type:"progress",msg:`Parsed: ${offRaw.length} offline rows, ${sysRaw.length} system rows`});
      const post=msg=>self.postMessage({type:"progress",msg});
      const wb=buildWorkbook(domain,matchKey,splitPaymentType,offRaw,sysRaw,post);
      post("Generating file...");
      const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
      const btSlug=billingType?`_${billingType.replace(/\s+/g,"_")}` :"";
      const filename=`Reconciliation_${market}_${domain.replace(/\s+/g,"_")}${btSlug}_${today()}.xlsx`;
      self.postMessage({type:"done",buf,filename},[buf]);
    }catch(err){
      self.postMessage({type:"error",msg:err.message});
    }
  }
};
</script>

<script type="text/babel">
const { useState, useCallback, useRef } = React;

const DOMAINS = {
  "Driver Cost":       { matchKey:"Driver ID", portalPath:"First Mile & Last Mile Cost / Line Haul Cost → Driver Cost", splitPaymentType:true },
  "Truck Rental Cost": { matchKey:"Agency ID", portalPath:"Line Haul Cost → Truck Rental Cost", splitPaymentType:false,
    billingTypes:["Trip Billing","TO Billing","MAWB Billing","Period Billing","Contract Task Billing","Master Task Billing","No Show Billing"] },
  "Labor Payroll":     { matchKey:"Ops ID", portalPath:"Labour Payroll", splitPaymentType:true },
};
const MARKETS = ["BR","ID","MY","PH","SG","TH","TW","VN"];

const UI={primary:"#2563eb",primaryLight:"#eff6ff",success:"#16a34a",successLight:"#f0fdf4",
  danger:"#dc2626",dangerLight:"#fef2f2",border:"#e5e7eb",muted:"#6b7280",
  bg:"#f9fafb",white:"#ffffff",header:"#1e3a5f"};

function FileUpload({label,file,onChange}){
  return(
    <div style={{flex:1}}>
      <div style={{fontSize:13,fontWeight:600,color:UI.muted,marginBottom:6,textTransform:"uppercase",letterSpacing:"0.05em"}}>{label}</div>
      <label style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
        border:`2px dashed ${file?UI.primary:UI.border}`,borderRadius:10,padding:"24px 16px",
        cursor:"pointer",background:file?UI.primaryLight:UI.white,transition:"all 0.2s",minHeight:100}}>
        <input type="file" accept=".csv,.xlsx,.xls" style={{display:"none"}} onChange={e=>onChange(e.target.files[0])}/>
        <div style={{fontSize:28,marginBottom:6}}>{file?"✅":"📂"}</div>
        <div style={{fontSize:13,color:file?UI.primary:UI.muted,fontWeight:500,textAlign:"center"}}>
          {file?file.name:"Click to upload CSV or Excel"}
        </div>
      </label>
    </div>
  );
}

function App(){
  const[market,setMarket]=useState("");
  const[domain,setDomain]=useState("");
  const[billingType,setBillingType]=useState("");
  const[sysFile,setSysFile]=useState(null);
  const[offFile,setOffFile]=useState(null);
  const[status,setStatus]=useState(null);
  const[progress,setProgress]=useState("");
  const[processing,setProcessing]=useState(false);
  const workerRef=useRef(null);

  const domainConf=domain?DOMAINS[domain]:null;
  const needsBilling=domainConf?.billingTypes?.length>0;
  const canRun=market&&domain&&(!needsBilling||billingType)&&sysFile&&offFile;

  const run=useCallback(async()=>{
    setProcessing(true);setStatus(null);setProgress("Reading files...");
    try{
      const{matchKey,splitPaymentType}=DOMAINS[domain];
      const[offAB,sysAB]=await Promise.all([
        sysFile.arrayBuffer(), offFile.arrayBuffer()
      ]);

      // Create worker from inline script
      const workerSrc=document.getElementById("worker-src").textContent;
      const blob=new Blob([workerSrc],{type:"application/javascript"});
      const workerUrl=URL.createObjectURL(blob);
      const worker=new Worker(workerUrl);
      workerRef.current=worker;

      worker.onmessage=e=>{
        const{type,msg,buf,filename}=e.data;
        if(type==="progress"){setProgress(msg);}
        else if(type==="done"){
          const blob2=new Blob([buf],{type:"application/octet-stream"});
          const url=URL.createObjectURL(blob2);
          const a=document.createElement("a");a.href=url;a.download=filename;a.click();
          URL.revokeObjectURL(url);URL.revokeObjectURL(workerUrl);
          setStatus({type:"success",msg:"✅ Excel downloaded — 7 sheets generated."});
          setProgress("");setProcessing(false);worker.terminate();
        }
        else if(type==="error"){
          setStatus({type:"error",msg:`❌ Error: ${msg}`});
          setProgress("");setProcessing(false);worker.terminate();URL.revokeObjectURL(workerUrl);
        }
      };

      worker.postMessage({type:"process",payload:{domain,matchKey,splitPaymentType,market,billingType,offAB,sysAB}},[offAB,sysAB]);
    }catch(err){
      setStatus({type:"error",msg:`❌ Error: ${err.message}`});
      setProgress("");setProcessing(false);
    }
  },[domain,market,billingType,sysFile,offFile]);

  return(
    <div style={{minHeight:"100vh",background:UI.bg,fontFamily:"'Inter',sans-serif",padding:"32px 16px"}}>
      <div style={{maxWidth:680,margin:"0 auto"}}>
        <div style={{background:UI.header,borderRadius:14,padding:"28px 32px",marginBottom:28,color:UI.white}}>
          <div style={{fontSize:22,fontWeight:700,marginBottom:4}}>🧾 Billing Reconciliation Tool</div>
          <div style={{fontSize:14,opacity:0.75}}>Compare offline and system billing data and export a reconciliation report</div>
        </div>

        <div style={{marginBottom:20,background:UI.white,borderRadius:12,border:`1px solid ${UI.border}`,overflow:"hidden"}}>
          <div style={{background:UI.header,padding:"14px 24px"}}><div style={{color:UI.white,fontWeight:700,fontSize:14}}>📋 How to Prepare Your Files</div></div>
          {[
            {num:1,title:"Extract & Prepare Offline Data",items:[
              <span>Prepare offline-calculated billing orders from vendor invoices</span>,
              <div>Compile all payout data into the same format as the monthly manual uploads on the Finance Portal
                <div style={{marginTop:6,padding:"8px 12px",background:"#fefce8",border:"1px solid #fde68a",borderRadius:7,fontSize:12,color:"#92400e"}}>
                  💡 Offline components must correspond with components under Finance Portal's billing rules. Check the <b>Mass Upload Template</b> for the correct offline billing template.
                </div>
              </div>
            ]},
            {num:2,title:"Extract System Data (Finance Portal)",items:[
              <div>Navigate to <span style={{display:"inline-flex",alignItems:"center",gap:4,margin:"0 4px",flexWrap:"wrap"}}>
                {["Finance Portal","SPX","Billing Order"].map((c,i)=>(
                  <span key={i} style={{display:"inline-flex",alignItems:"center",gap:4}}>
                    <span style={{background:"#f1f5f9",border:"1px solid #cbd5e1",borderRadius:5,padding:"1px 8px",fontSize:12,fontWeight:600,color:"#334155"}}>{c}</span>
                    <span style={{color:UI.muted,fontSize:12}}>→</span>
                  </span>
                ))}
                <span style={{background:"#eff6ff",border:"1px solid #93c5fd",borderRadius:5,padding:"1px 8px",fontSize:12,fontWeight:600,color:"#1d4ed8"}}>{domain?DOMAINS[domain].portalPath:"[Select Domain]"}</span>
              </span></div>,
              <span>Apply the <span style={{background:"#f1f5f9",border:"1px solid #cbd5e1",borderRadius:5,padding:"1px 8px",fontSize:12,fontWeight:600,color:"#334155"}}>Billing Start Time</span> filter and export all results — select <b>All in All Pages</b></span>,
              <span>Ensure that <span style={{background:"#f1f5f9",border:"1px solid #cbd5e1",borderRadius:5,padding:"1px 8px",fontSize:12,fontWeight:600,color:"#334155"}}>Data Source = System</span> filter is applied</span>,
              <div>Ensure billing periods between offline and system files are aligned
                <div style={{marginTop:6,padding:"8px 12px",background:"#fefce8",border:"1px solid #fde68a",borderRadius:7,fontSize:12,color:"#92400e"}}>
                  💡 Misaligned billing periods will result in incorrect discrepancies and inaccurate accuracy figures
                </div>
              </div>
            ]}
          ].map(({num,title,items})=>(
            <div key={num} style={{borderBottom:num===1?`1px solid ${UI.border}`:"none"}}>
              <div style={{padding:"16px 24px",display:"flex",gap:14,alignItems:"flex-start"}}>
                <div style={{minWidth:28,height:28,borderRadius:"50%",background:UI.primaryLight,color:UI.primary,fontWeight:700,fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",marginTop:1}}>{num}</div>
                <div>
                  <div style={{fontWeight:700,fontSize:14,color:"#111",marginBottom:8}}>{title}</div>
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {items.map((item,i)=>(
                      <div key={i} style={{display:"flex",gap:10,alignItems:"flex-start"}}>
                        <span style={{color:UI.primary,marginTop:2,fontSize:13}}>▸</span>
                        <div style={{fontSize:13,color:"#374151",lineHeight:1.6}}>{item}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          ))}
        </div>

        <div style={{background:UI.white,borderRadius:12,padding:"22px 28px",marginBottom:16,border:`1px solid ${UI.border}`}}>
          <div style={{fontSize:13,fontWeight:600,color:UI.muted,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>Step 1 — Select Market &amp; Domain</div>
          <div style={{display:"flex",gap:12,marginBottom:12}}>
            <div style={{flex:"0 0 120px"}}>
              <div style={{fontSize:12,color:UI.muted,marginBottom:4}}>Market</div>
              <select value={market} onChange={e=>setMarket(e.target.value)} style={{width:"100%",padding:"10px 14px",borderRadius:8,border:`1.5px solid ${market?UI.primary:UI.border}`,fontSize:15,color:market?"#111":UI.muted,background:UI.white,outline:"none",cursor:"pointer"}}>
                <option value="">— Market —</option>
                {MARKETS.map(m=><option key={m} value={m}>{m}</option>)}
              </select>
            </div>
            <div style={{flex:1}}>
              <div style={{fontSize:12,color:UI.muted,marginBottom:4}}>Domain</div>
              <select value={domain} onChange={e=>{setDomain(e.target.value);setBillingType("");}} style={{width:"100%",padding:"10px 14px",borderRadius:8,border:`1.5px solid ${domain?UI.primary:UI.border}`,fontSize:15,color:domain?"#111":UI.muted,background:UI.white,outline:"none",cursor:"pointer"}}>
                <option value="">— Domain —</option>
                {Object.keys(DOMAINS).map(d=><option key={d} value={d}>{d}</option>)}
              </select>
            </div>
          </div>
          {needsBilling&&(
            <div style={{marginTop:4}}>
              <div style={{fontSize:12,color:UI.muted,marginBottom:4}}>Billing Type</div>
              <select value={billingType} onChange={e=>setBillingType(e.target.value)} style={{width:"100%",padding:"10px 14px",borderRadius:8,border:`1.5px solid ${billingType?UI.primary:UI.border}`,fontSize:15,color:billingType?"#111":UI.muted,background:UI.white,outline:"none",cursor:"pointer"}}>
                <option value="">— Select Billing Type —</option>
                {DOMAINS[domain].billingTypes.map(bt=><option key={bt} value={bt}>{bt}</option>)}
              </select>
            </div>
          )}
          {domain&&<div style={{marginTop:10,fontSize:13,color:UI.muted}}>Matching key: <span style={{color:UI.primary,fontWeight:600}}>{DOMAINS[domain].matchKey}</span></div>}
        </div>

        <div style={{background:UI.white,borderRadius:12,padding:"22px 28px",marginBottom:16,border:`1px solid ${UI.border}`}}>
          <div style={{fontSize:13,fontWeight:600,color:UI.muted,marginBottom:14,textTransform:"uppercase",letterSpacing:"0.05em"}}>Step 2 — Upload Files</div>
          <div style={{display:"flex",gap:16}}>
            <FileUpload label="System Billing File" file={sysFile} onChange={setSysFile}/>
            <FileUpload label="Offline Billing File" file={offFile} onChange={setOffFile}/>
          </div>
        </div>

        <div style={{background:UI.white,borderRadius:12,padding:"22px 28px",marginBottom:16,border:`1px solid ${UI.border}`}}>
          <div style={{fontSize:13,fontWeight:600,color:UI.muted,marginBottom:14,textTransform:"uppercase",letterSpacing:"0.05em"}}>Step 3 — Generate Report</div>
          <button onClick={run} disabled={!canRun||processing}
            style={{width:"100%",padding:"13px 0",borderRadius:9,border:"none",
              background:canRun&&!processing?UI.primary:UI.border,
              color:canRun&&!processing?UI.white:UI.muted,
              fontSize:16,fontWeight:700,cursor:canRun&&!processing?"pointer":"not-allowed",transition:"all 0.2s"}}>
            {processing?"⏳ Processing...":"⬇️ Generate & Download Excel"}
          </button>
          {processing&&progress&&(
            <div style={{marginTop:10}}>
              <div style={{fontSize:12,color:UI.muted,marginBottom:6,textAlign:"center"}}>{progress}</div>
              <div style={{height:4,background:"#e5e7eb",borderRadius:4,overflow:"hidden"}}>
                <div style={{height:"100%",background:UI.primary,borderRadius:4,animation:"pulse 1.5s ease-in-out infinite"}}/>
              </div>
            </div>
          )}
          {!canRun&&!processing&&<div style={{fontSize:12,color:UI.muted,marginTop:8,textAlign:"center"}}>
            {!market?"Select a market to continue":!domain?"Select a domain to continue":needsBilling&&!billingType?"Select a billing type to continue":"Upload both files to continue"}
          </div>}
        </div>

        {status&&<div style={{borderRadius:10,padding:"14px 20px",fontSize:14,fontWeight:500,
          background:status.type==="success"?UI.successLight:UI.dangerLight,
          color:status.type==="success"?UI.success:UI.danger,
          border:`1px solid ${status.type==="success"?"#bbf7d0":"#fecaca"}`}}>
          {status.msg}
        </div>}
      </div>
      <style>{`@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}`}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
